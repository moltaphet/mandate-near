[package]
name = "mock-oracle"
description = "Sandbox-only stand-in for price-oracle.near with the same answer shapes and recency rule"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Testnet deployments: only the parent account (for oracle.mandate-t1.testnet, mandate-t1.testnet)
# may write prices. The sandbox build leaves writes open so tests can set any report.
parent-writes-only = []

[dependencies]
near-sdk.workspace = true

[lints]
workspace = true
