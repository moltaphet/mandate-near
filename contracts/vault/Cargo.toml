[package]
name = "mandate-vault"
description = "Treasury vault that only signs NEAR Intents trades which satisfy an owner-defined mandate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# NEP-330: exposed via the `contract_source_metadata` view when built with cargo-near.
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build, as generated by `cargo near new` (cargo-near 0.22.0).
# Anyone can rebuild the deployed wasm bit for bit and compare hashes.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
# The tag above is descriptive only; the image is identified by this digest.
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk.workspace = true
uint.workspace = true
# base58 for the signature string NEAR Intents expects (ed25519:<base58>).
bs58 = "0.5"

[dev-dependencies]
# The keeper drives the vault in tests; it is not a runtime dependency.
mandate-keeper = { path = "../../keeper" }
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest.workspace = true
chrono.workspace = true
near-sandbox.workspace = true
near-api.workspace = true
cargo-near-build.workspace = true
tokio.workspace = true
testresult.workspace = true

[lints]
workspace = true
