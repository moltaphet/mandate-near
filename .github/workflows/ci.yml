name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs on every pull request. Docs-only changes finish here in about a minute.
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Claim and link references
        run: bash scripts/check-claims.sh

  # Decides whether a pull request changes anything besides documentation.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Any path outside documentation counts as code, including workflows and scripts.
          if git diff --name-only "$base" "$head" \
             | grep -vE '^(docs/|README\.md$|SECURITY\.md$|THREAT_MODEL\.md$|\.gitleaksignore$)' \
             | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # The runner context is not available in job-level env, so use a fixed temp path.
      INTENTS_ARCHIVE: /tmp/intents-reviewed.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Match rust-toolchain.toml explicitly, including native checks and WASM target.
      - name: Install toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # The pinned release binary, checked against a SHA-256 recorded here (not read from the
      # release), so a replaced download fails instead of running.
      - name: Install cargo-near
        run: |
          set -euo pipefail
          url=https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          # GitHub release downloads can fail transiently (HTTP 504). Retry the same pinned URL.
          curl --proto '=https' --tlsv1.2 -LsSf --retry 6 --retry-all-errors --retry-delay 20 -o cargo-near.tar.gz "$url"
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz
          install -m 755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
          rm -rf cargo-near.tar.gz cargo-near-x86_64-unknown-linux-gnu
          cargo near --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download and verify pinned public Intents source archive
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.request

          manifest = json.loads(Path("integrations/intents-executor/source-manifest.json").read_text())
          upstream = manifest["upstream"]
          if upstream["repository"] != "https://github.com/near/intents" or not re.fullmatch(r"[0-9a-f]{40}", upstream["commit"]):
              raise SystemExit("Unsupported public source repository or commit")
          url = "https://codeload.github.com/near/intents/tar.gz/" + upstream["commit"]
          request = urllib.request.Request(url, headers={"User-Agent": "Mandate-CI-source-verifier"})
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.geturl() != url:
                  raise SystemExit("Unexpected source archive redirect")
              raw = response.read(upstream["archive_bytes"] + 1)
          if len(raw) != upstream["archive_bytes"] or hashlib.sha256(raw).hexdigest() != upstream["archive_sha256"]:
              raise SystemExit("Pinned source archive size/hash mismatch")
          Path(os.environ["INTENTS_ARCHIVE"]).write_bytes(raw)
          print("Verified pinned public archive bytes; no extraction or code execution performed")
      - name: Prepare reviewed executor source and frozen lock
        run: python3 -B integrations/intents-executor/prepare.py --archive "$INTENTS_ARCHIVE" --destination target/intents-executor/source
      - name: Fetch public locked executor dependencies
        run: cargo +1.95.0 fetch --locked --manifest-path target/intents-executor/source/Cargo.toml
      - name: Build optimized source-owned executor and bound manifest
        # rust-cache exports CARGO_INCREMENTAL=0. The builder refuses any Cargo build
        # override on purpose, so clear that one variable for this step only.
        run: env -u CARGO_INCREMENTAL python3 -B integrations/intents-executor/build.py --archive "$INTENTS_ARCHIVE" --destination target/intents-executor/source
      - name: Test native journal in the verified executor source
        run: CARGO_TARGET_DIR="$PWD/target/intents-executor/build" cargo +1.95.0 test -p defuse --features contract --lib --manifest-path target/intents-executor/source/Cargo.toml --locked --offline
      - name: Lint verified executor library with warnings denied
        run: CARGO_TARGET_DIR="$PWD/target/intents-executor/build" cargo +1.95.0 clippy -p defuse --features contract --lib --manifest-path target/intents-executor/source/Cargo.toml --locked --offline --no-deps -- -D warnings
      - name: Verify (references, Rust, browser logic, inspector, sandbox and gas)
        run: ./scripts/verify.sh --integration
