[workspace]
resolver = "3"
members = ["contracts/vault"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/moltaphet/mandate-near"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = "5.30.0"

# Contract-size and safety settings recommended for NEAR wasm.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
