<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Mandate: your agent proposes, your rules decide</title>
  <desc id="d">A proposal moves from Propose through Check, Sign and Settle. A second proposal branches down from Check and is refused as TradeTooLarge. Testnet, not audited, mainnet NO-GO.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e8efe9" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .serif{font-family:Georgia,"Times New Roman",serif}
    .grid{animation:drift 26s linear infinite}
    @keyframes drift{to{transform:translate(28px,28px)}}
    .node{fill:#0b0f0d;stroke:#3ddc97;stroke-width:3}
    .n1{animation:lit1 9s linear infinite}
    .n2{animation:lit2 9s linear infinite}
    .n3{animation:lit3 9s linear infinite}
    .n4{animation:lit4 9s linear infinite}
    @keyframes lit1{0%,100%{fill:#3ddc97}}
    @keyframes lit2{0%,30%{fill:#0b0f0d}34%,100%{fill:#3ddc97}}
    @keyframes lit3{0%,63%{fill:#0b0f0d}67%,100%{fill:#3ddc97}}
    @keyframes lit4{0%,96%{fill:#0b0f0d}99%,100%{fill:#3ddc97}}
    .rpacket{animation:rwin 9s linear infinite}
    @keyframes rwin{0%,32%{opacity:0}34%,64%{opacity:1}66%,100%{opacity:0}}
    .rlabel{animation:lwin 9s linear infinite}
    @keyframes lwin{0%,32%{opacity:.35}36%,64%{opacity:1}68%,100%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.grid,.n1,.n2,.n3,.n4,.rpacket,.rlabel{animation:none}.packet,.rpacket{display:none}}
  </style>

  <rect width="1200" height="460" rx="18" fill="#0b0f0d"/>
  <g clip-path="inset(0 round 18px)">
    <rect class="grid" x="-28" y="-28" width="1256" height="516" fill="url(#dots)"/>
  </g>
  <rect width="1200" height="460" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="18" fill="none" stroke="#3ddc97" stroke-opacity="0.25"/>

  <text x="64" y="74" class="mono" font-size="15" letter-spacing="3" fill="#9fada5">NEAR · AGENT SECURITY · MANDATE</text>
  <text x="64" y="150" class="serif" font-size="62" fill="#e8efe9">Your agent proposes.</text>
  <text x="64" y="222" class="serif" font-size="62" font-style="italic" fill="#e8efe9">Your rules decide.</text>

  <g class="mono" font-size="14">
    <rect x="852" y="50" width="96" height="30" rx="15" fill="#132019" stroke="#3ddc97" stroke-opacity="0.45"/>
    <text x="900" y="70" text-anchor="middle" fill="#7ff0bd">Testnet</text>
    <rect x="956" y="50" width="116" height="30" rx="15" fill="#2a2113" stroke="#f2b84b" stroke-opacity="0.5"/>
    <text x="1014" y="70" text-anchor="middle" fill="#f5c66e">Not audited</text>
    <rect x="852" y="88" width="220" height="30" rx="15" fill="#2a1612" stroke="#ff7d62" stroke-opacity="0.5"/>
    <text x="962" y="108" text-anchor="middle" fill="#ff7d62">Mainnet NO-GO</text>
  </g>

  <g transform="translate(0,0)">
    <path d="M140 320 H1060" stroke="#e8efe9" stroke-opacity="0.15" stroke-width="3" fill="none"/>
    <path d="M400 332 V412 H440" stroke="#ff7d62" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.85"/>

    <g class="mono" font-size="20" fill="#9fada5" text-anchor="middle">
      <text x="140" y="290">Propose</text>
      <text x="400" y="290">Check</text>
      <text x="740" y="290">Sign</text>
      <text x="1060" y="290">Settle</text>
    </g>
    <circle class="node n1" cx="140" cy="320" r="13"/>
    <circle class="node n2" cx="400" cy="320" r="13"/>
    <circle class="node n3" cx="740" cy="320" r="13"/>
    <circle class="node n4" cx="1060" cy="320" r="13"/>

    <g class="packet">
      <circle r="12" fill="#3ddc97" opacity="0.5" filter="url(#soft)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M140 320 H1060"/>
      </circle>
      <circle r="7" fill="#3ddc97">
        <animateMotion dur="9s" repeatCount="indefinite" path="M140 320 H1060"/>
      </circle>
    </g>
    <circle class="rpacket" r="7" fill="#ff7d62">
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.33;0.5;1" keyPoints="0;0;1;1" path="M400 320 V412 H440"/>
    </circle>
    <text class="mono rlabel" x="452" y="418" font-size="19" fill="#ff7d62">Refused · TradeTooLarge</text>

    <g class="mono" font-size="15" fill="#9fada5">
      <text x="140" y="360" text-anchor="middle">2 USDC → 0.55 wNEAR</text>
      <text x="740" y="360" text-anchor="middle">only after every check passes</text>
      <text x="1060" y="360" text-anchor="middle">both ledgers change</text>
      <text x="452" y="442">60 USDC against a 50 USDC cap: nothing signed</text>
    </g>
  </g>
</svg>
